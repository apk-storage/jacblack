<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Знак JacBlack: плашка со скруглением и вырезанной буквой.
    Монохром, как и весь интерфейс.

    Два варианта под тему браузера. Вкладка бывает и светлой, и тёмной,
    и одноцветная плашка на своём же фоне пропадает: чёрная теряется
    в тёмной панели, белая — в светлой. Поэтому цвета меняются местами.
  -->
  <style>
    .tile { fill: #0c0d0f; }
    .mark { fill: #f2f3f5; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f2f3f5; }
      .mark { fill: #0c0d0f; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" />
  <path
    class="mark"
    d="M38.5 14v25.8c0 6.9-4.4 10.7-11.2 10.7-5.2 0-9.3-2.3-11.3-6.4l6.4-3.9c1 2 2.6 3.1 4.6 3.1 2.6 0 4.1-1.6 4.1-4.6V14z"
  />
</svg>
