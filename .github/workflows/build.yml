name: Build

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Tag name for release builds"
        required: false
        type: string
      checkout_ref:
        description: "Git ref to checkout (e.g., refs/tags/1.0.0)"
        required: false
        type: string

permissions:
  contents: write
  actions: read
  packages: read
  id-token: write

jobs:
  web-quality:
    name: Web quality gates
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      # Интерфейс живёт в webui/. Прежний web/ удалён 02.08.2026 вместе с PWA,
      # двумя языками и редактором настроек — с ним ушли проверки на eslint,
      # Playwright и наличие sw.js, которых у нового интерфейса нет.
      - name: Install dependencies
        run: npm ci
        working-directory: webui
      - name: Verify generated OpenAPI types
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/types.ts
        working-directory: webui
      - name: Typecheck
        run: npm run typecheck
        working-directory: webui
      - name: Test
        run: npm test
        working-directory: webui
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: webui
      - name: Build
        run: npm run build
        working-directory: webui

  extract-version:
    name: Extract version
    permissions:
      actions: read
    uses: ./.github/workflows/reusable-extract-version.yml
    with:
      tag: ${{ inputs.tag }}
      checkout_ref: ${{ inputs.checkout_ref }}
    secrets: inherit

  build:
    name: .NET build
    needs:
      - extract-version
      - web-quality
    uses: ./.github/workflows/reusable-build.yml
    with:
      checkout_ref: ${{ needs.extract-version.outputs.checkout_ref }}
      dotnet_version: ${{ vars.DOTNET_VERSION || '10.0.x' }}
      retention_days: ${{ needs.extract-version.outputs.is_release == 'true' && 30 || 7 }}
    secrets: inherit

  build-docker-image:
    name: Build and push Docker image
    needs: extract-version
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      image: ${{ vars.IMAGE_NAME || 'jacred' }}
      version: ${{ needs.extract-version.outputs.version }}
      tag_latest: ${{ needs.extract-version.outputs.tag_latest }}
      checkout_ref: ${{ needs.extract-version.outputs.checkout_ref }}
      push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
      attest_github: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
      sbom: true
      provenance: "mode=max"
      generate_syft_sbom: true
      sbom_artifact_retention_days: ${{ (inputs.tag != '' || startsWith(github.ref, 'refs/tags/')) && 30 || 7 }}
    secrets: inherit

  upload-release-assets:
    name: Attach artifacts to release
    permissions:
      contents: write
    needs:
      - extract-version
      - build
    if: needs.extract-version.outputs.is_release == 'true'
    uses: ./.github/workflows/reusable-upload-release-assets.yml
    with:
      tag: ${{ needs.extract-version.outputs.release_tag }}
      artifact_pattern: "jacred-*-*"
    secrets: inherit
